[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-depth-budgeter"
version = "0.1.0"
description = "Adaptive compute allocation engine that dynamically sets reasoning token budgets based on incoming problem complexity classification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
reasoning-depth-budgeter = "reasoning_depth_budgeter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reasoning_depth_budgeter*"]
